services:
  mlflow_example:
    build:
      context: ./
      dockerfile: ./Dockerfile
    image: ml_service:$USER
    container_name: ml_service_$USER
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - 8890:8890
    environment:
      - MLFLOW_TRACKING_URI=http://158.160.2.37:5000/
      - DEFAULT_RUN_ID=${DEFAULT_RUN_ID}
      - GRAPHITE_HOST=graphite
      - GRAPHITE_PORT=2003
      - GRAPHITE_PREFIX=ml_service
      - DRIFT_REFERENCE_SIZE=50
      - DRIFT_CURRENT_SIZE=50
      - DRIFT_REPORT_DIR=/app/artifacts/evidently
    depends_on:
      - graphite
    command: uvicorn main:app --host 0.0.0.0 --port 8890

  prometheus:
    image: prom/prometheus
    container_name: prometheus_$USER
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - 9090:9090
    depends_on:
      - mlflow_example
      - alertmanager

  alertmanager:
    image: prom/alertmanager
    container_name: alertmanager_$USER
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - 9093:9093

  graphite:
    image: graphiteapp/graphite-statsd
    container_name: graphite_$USER
    ports:
      - 8081:80
      - 2003:2003
      - 8125:8125/udp

  grafana:
    image: grafana/grafana
    container_name: grafana_$USER
    environment:
      - GF_SECURITY_ADMIN_USER=student12
      - GF_SECURITY_ADMIN_PASSWORD=bd333eed-4b01-435d-99f5-9bceb2613f1c
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - 3000:3000
    depends_on:
      - prometheus
      - graphite
      - alertmanager
